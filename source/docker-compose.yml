services:
  db:
    image: mysql:8
    command: --default-time-zone=+00:00   # always UTC; do not change
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"   # host:container — 3307 on your machine, still 3306 inside
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "5175:5175"
    environment:
      TZ: Asia/Bangkok
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_NAME: mydb
      DATABASE_URL: "mysql://user:password@db:3306/mydb"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FRONTEND_URL: "http://localhost:3000"
      PORT: 5175
      NODE_ENV: production
    volumes:
      - user_images:/app/public/userImages
      - equipment_images:/app/public/equipmentImages
      - consumable_images:/app/public/consumableImages
      - lab_room_images:/app/public/labRoomImages
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5175"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  user_images:
  equipment_images:
  consumable_images:
  lab_room_images: